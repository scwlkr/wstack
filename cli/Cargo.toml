[package]
name = "wstack"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Inspect agent skills and audit development capabilities"
license = "MIT"
publish = false

[lib]
name = "wstack"
path = "src/lib.rs"

[[bin]]
name = "wstack"
path = "src/main.rs"

[[test]]
name = "check"
path = "../tests/check.rs"

[[test]]
name = "cli"
path = "../tests/cli.rs"

[[test]]
name = "features"
path = "../tests/features.rs"

[[test]]
name = "eyes"
path = "../tests/eyes.rs"

[[test]]
name = "eyes_scope"
path = "../tests/eyes_scope.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
