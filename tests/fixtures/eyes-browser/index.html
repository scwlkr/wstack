<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Draft editor</title>
<style>
  body { max-width: 32rem; margin: 3rem auto; font: 18px system-ui; }
  input { display: block; width: 100%; margin: .5rem 0 1rem; padding: .5rem; }
  button { padding: .5rem 1rem; }
</style>
<h1>Draft editor</h1>
<label for="title">Title</label>
<input id="title" disabled>
<button id="save" disabled>Save</button>
<p role="status"></p>
<script>
const title = document.querySelector('#title');
const save = document.querySelector('#save');
const status = document.querySelector('[role="status"]');
fetch('/draft').then(response => response.json()).then(draft => {
  title.value = draft.title;
  title.disabled = false;
  save.disabled = false;
});
save.addEventListener('click', async () => {
  status.textContent = 'Saving';
  const response = await fetch('/draft', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({title: title.value})
  });
  const result = await response.json();
  status.textContent = response.ok ? 'Saved' : result.error;
});
</script>
</html>
